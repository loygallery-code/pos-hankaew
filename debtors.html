<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ລູກໜີ້ — ຮ້ານເສີມຊັບ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lock">
  <div style="width:44px;height:44px;border-radius:12px;background:var(--marigold);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--canopy-dark);font-size:20px;margin-bottom:14px;">ອ</div>
  <h1 id="lockShopName">ຮ້ານເສີມຊັບ</h1>
  <p>ໃສ່ລະຫັດຜ່ານເພື່ອເປີດລະບົບ</p>
  <div class="pin-dots" id="pinDots"></div>
  <div class="pin-pad" id="pinPad"></div>
  <div id="lockErr"></div>
</div>

<script>
(function(){
  try{
    var until = parseInt(localStorage.getItem('pos_unlocked_until')||'0',10);
    if(Date.now() < until){
      document.getElementById('lock').style.display='none';
      document.getElementById('app').style.display='flex';
    }
  }catch(e){}
})();
</script>

<div id="app">
  <header>
    <div class="brand">
      <div class="mark">ອ</div>
      <div>
        <h1 id="shopNameLbl">ຮ້ານເສີມຊັບ</h1>
        <div class="sub">ລະບົບຂາຍ &amp; ຄຸ້ມຄອງສາງ</div>
      </div>
    </div>
    <nav>
      <a href="index.html" data-page="pos">ຂາຍເຄື່ອງ</a>
      <a href="stock.html" data-page="stock">ສາງສິນຄ້າ</a>
      <a href="reports.html" data-page="reports">ລາຍງານ</a>
      <a href="exchange.html" data-page="exchange">ແລກປ່ຽນເງິນຕາ</a>
      <a href="debtors.html" data-page="debtors">ລູກໜີ້</a>
      <a href="summary.html" data-page="summary">ສະຫຼຸບບັນຊີ</a>
      <a href="settings.html" data-page="settings">ຕັ້ງຄ່າ</a>
      <a href="#" id="lockBtn" style="opacity:.7;">ລັອກ 🔒</a>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <h2>ລູກໜີ້</h2>
      <div style="display:flex;gap:8px;">
        <input id="debtorSearch" type="text" placeholder="ຄົ້ນຫາລູກໜີ້…" style="padding:9px 12px;border:1px solid var(--line);border-radius:9px;">
        <button class="btn btn-ghost" style="width:auto;margin-top:0;" id="printDebtorsBtn">🖨 ພິມລາຍງານ</button>
        <button class="btn btn-primary" style="width:auto;" id="addDebtorBtn">+ ເພີ່ມລູກໜີ້</button>
      </div>
    </div>
    <div class="stat-row" id="debtorStats"></div>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>ຊື່ລູກໜີ້</th><th>ເບີໂທ</th><th>ໜີ້ຄົງເຫຼືອ</th><th></th></tr></thead>
        <tbody id="debtorsTbody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- ເພີ່ມລູກໜີ້ -->
<div class="modal-bg" id="debtorModalBg">
  <div class="modal">
    <h3>ເພີ່ມລູກໜີ້</h3>
    <div class="field"><label>ຊື່</label><input id="dmName" type="text"></div>
    <div class="field"><label>ເບີໂທ (ຖ້າມີ)</label><input id="dmPhone" type="text"></div>
    <div class="field"><label>ໝາຍເຫດ</label><input id="dmNotes" type="text"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="dmCancel">ຍົກເລີກ</button>
      <button class="btn btn-primary" id="dmSave">ບັນທຶກ</button>
    </div>
  </div>
</div>

<!-- ລາຍລະອຽດລູກໜີ້ + ຮັບຊຳລະ -->
<div class="modal-bg" id="debtorDetailModalBg">
  <div class="modal">
    <h3 id="ddName"></h3>
    <div class="stat-row" style="grid-template-columns:1fr 1fr;margin-bottom:14px;">
      <div class="stat"><div class="label">ໜີ້ທັງໝົດ</div><div class="val mono" id="ddTotalOwed"></div></div>
      <div class="stat"><div class="label">ຈຳນວນບິນຄ້າງ</div><div class="val" id="ddSaleCount"></div></div>
    </div>
    <div class="field">
      <label>ບັນທຶກຮັບຊຳລະ (ກີບ)</label>
      <input id="ddPaymentAmount" type="number" min="0">
    </div>
    <button class="btn btn-primary" id="ddSavePayment">ບັນທຶກຮັບຊຳລະ</button>
    <h3 style="font-size:13px;margin:18px 0 8px;color:var(--ink-soft);">ປະຫວັດ</h3>
    <div id="ddHistory" style="max-height:220px;overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="ddClose">ປິດ</button>
    </div>
  </div>
</div>

<!-- ລາຍລະອຽດສິນຄ້າທີ່ຕິດໜີ້ (ຕໍ່ບິນ) -->
<div class="modal-bg" id="creditItemsModalBg">
  <div class="modal">
    <h3>ສິນຄ້າທີ່ຕິດໜີ້</h3>
    <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:10px;" id="ciTime"></div>
    <div id="ciItems" style="max-height:280px;overflow-y:auto;"></div>
    <div class="rf-total" style="margin-top:10px;"><span>ລວມ</span><span id="ciTotal" class="mono"></span></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="ciClose">ປິດ</button>
    </div>
  </div>
</div>

<div class="report-print" id="reportPrintArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script src="debtors.js"></script>
</body>
</html>
