<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ແລກປ່ຽນເງິນຕາ — ຮ້ານເສີມຊັບ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lock">
  <div style="width:44px;height:44px;border-radius:12px;background:var(--marigold);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--canopy-dark);font-size:20px;margin-bottom:14px;">ອ</div>
  <h1 id="lockShopName">ຮ້ານເສີມຊັບ</h1>
  <p>ໃສ່ລະຫັດຜ່ານເພື່ອເປີດລະບົບ</p>
  <div class="pin-dots" id="pinDots"></div>
  <div class="pin-pad" id="pinPad"></div>
  <div id="lockErr"></div>
</div>

<script>
(function(){
  try{
    var until = parseInt(localStorage.getItem('pos_unlocked_until')||'0',10);
    if(Date.now() < until){
      document.getElementById('lock').style.display='none';
      document.getElementById('app').style.display='flex';
    }
  }catch(e){}
})();
</script>

<div id="app">
  <header>
    <div class="brand">
      <div class="mark">ອ</div>
      <div>
        <h1 id="shopNameLbl">ຮ້ານເສີມຊັບ</h1>
        <div class="sub">ລະບົບຂາຍ &amp; ຄຸ້ມຄອງສາງ</div>
      </div>
    </div>
    <nav>
      <a href="index.html" data-page="pos">ຂາຍເຄື່ອງ</a>
      <a href="stock.html" data-page="stock">ສາງສິນຄ້າ</a>
      <a href="reports.html" data-page="reports">ລາຍງານ</a>
      <a href="exchange.html" data-page="exchange">ແລກປ່ຽນເງິນຕາ</a>
      <a href="settings.html" data-page="settings">ຕັ້ງຄ່າ</a>
      <a href="#" id="lockBtn" style="opacity:.7;">ລັອກ 🔒</a>
    </nav>
  </header>

  <main>
    <div class="toolbar">
      <h2>ແລກປ່ຽນເງິນຕາ (ກີບ ⇄ ບາດ)</h2>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1.3fr;gap:16px;align-items:start;">
      <!-- ຟອມແລກປ່ຽນ -->
      <div class="modal" style="width:auto;max-width:none;">
        <div class="cat-row" id="exDirRow" style="margin-bottom:16px;">
          <button class="chip active" id="dirLakToThb" style="flex:1;">ກີບ → ບາດ</button>
          <button class="chip" id="dirThbToLak" style="flex:1;">ບາດ → ກີບ</button>
        </div>
        <div class="field">
          <label id="exInLabel">ລູກຄ້າເອົາມາ (ກີບ)</label>
          <input id="exAmountIn" type="number" min="0" placeholder="0">
        </div>
        <div style="text-align:center;font-size:20px;color:var(--ink-soft);margin:6px 0;">↓</div>
        <div class="field">
          <label id="exOutLabel">ຈ່າຍໃຫ້ລູກຄ້າ (ບາດ)</label>
          <input id="exAmountOut" type="text" readonly class="mono" style="background:var(--paper-2);font-weight:700;font-size:16px;">
        </div>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-bottom:14px;" id="exRateNote"></div>
        <button class="btn btn-primary" id="exSaveBtn">ບັນທຶກການແລກປ່ຽນ</button>
      </div>

      <!-- ປະຫວັດ + ສະຫຼຸບ -->
      <div>
        <div class="stat-row" id="exStats"></div>
        <h3 style="font-size:13.5px;margin:0 0 8px;color:var(--ink-soft);">ປະຫວັດການແລກປ່ຽນ (30 ວັນຫຼັງສຸດ)</h3>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>ເວລາ</th><th>ທິດທາງ</th><th>ຮັບເຂົ້າ</th><th>ຈ່າຍອອກ</th><th>ອັດຕາ</th></tr></thead>
            <tbody id="exTbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script src="exchange.js"></script>
</body>
</html>
