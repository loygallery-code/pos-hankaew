<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ຂາຍເຄື່ອງ — ຮ້ານເສີມຊັບ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lock">
  <div style="width:44px;height:44px;border-radius:12px;background:var(--marigold);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--canopy-dark);font-size:20px;margin-bottom:14px;">ອ</div>
  <h1 id="lockShopName">ຮ້ານເສີມຊັບ</h1>
  <p>ໃສ່ລະຫັດຜ່ານເພື່ອເປີດລະບົບ</p>
  <div class="pin-dots" id="pinDots"></div>
  <div class="pin-pad" id="pinPad"></div>
  <div id="lockErr"></div>
</div>

<script>
(function(){
  try{
    var until = parseInt(localStorage.getItem('pos_unlocked_until')||'0',10);
    if(Date.now() < until){
      document.getElementById('lock').style.display='none';
      document.getElementById('app').style.display='flex';
    }
  }catch(e){}
})();
</script>

<div id="app">
  <header>
    <div class="brand">
      <div class="mark">ອ</div>
      <div>
        <h1 id="shopNameLbl">ຮ້ານເສີມຊັບ</h1>
        <div class="sub">ລະບົບຂາຍ &amp; ຄຸ້ມຄອງສາງ</div>
      </div>
    </div>
    <nav>
      <a href="index.html" data-page="pos">ຂາຍເຄື່ອງ</a>
      <a href="stock.html" data-page="stock">ສາງສິນຄ້າ</a>
      <a href="reports.html" data-page="reports">ລາຍງານ</a>
      <a href="exchange.html" data-page="exchange">ແລກປ່ຽນເງິນຕາ</a>
      <a href="settings.html" data-page="settings">ຕັ້ງຄ່າ</a>
      <a href="#" id="lockBtn" style="opacity:.7;">ລັອກ 🔒</a>
      <span id="onlineBadge" style="font-size:11px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.12);"></span>
    </nav>
  </header>

  <main>
    <div class="pos-grid">
      <div>
        <div class="search-row">
          <input id="posSearch" type="text" placeholder="ຄົ້ນຫາ ຫຼື ຍິງບາໂຄດ ແລ້ວກົດ Enter…" autocomplete="off">
        </div>
        <div class="cat-row" id="posCats"></div>
        <div class="product-grid" id="posGrid"></div>
      </div>

      <div class="receipt">
        <div class="receipt-head">
          <h2>ໃບບິນ</h2>
          <span id="cartCount">0 ລາຍການ</span>
        </div>
        <div class="cart-items" id="cartItems">
          <div class="empty-note">ຍັງບໍ່ມີສິນຄ້າໃນກະຕ່າ</div>
        </div>
        <div class="jag"></div>
        <div class="receipt-foot">
          <div class="rf-row"><span>ຈຳນວນລາຍການ</span><span id="rfCount">0</span></div>
          <div class="rf-total"><span>ລວມທັງໝົດ</span><span id="rfTotal" class="mono">0 ₭</span></div>
          <button class="btn btn-primary" id="checkoutBtn" disabled>ຄິດເງິນ / ຊຳລະ</button>
          <button class="btn btn-ghost" id="clearCartBtn">ລ້າງກະຕ່າ</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Checkout modal -->
<div class="modal-bg" id="checkoutModalBg">
  <div class="modal">
    <h3>ຢືນຢັນການຊຳລະ</h3>
    <div class="rf-row"><span>ຈຳນວນລາຍການ</span><span id="coCount"></span></div>
    <div class="rf-total"><span>ຍອດຊຳລະ</span><span id="coTotal" class="mono"></span></div>
    <div class="field" style="display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="coIsThb" style="width:auto;">
      <label for="coIsThb" style="margin:0;">ລູກຄ້າຈ່າຍເປັນເງິນບາດ (THB)</label>
    </div>
    <div class="field"><label id="coCashLabel">ຮັບເງິນມາ (ກີບ)</label><input id="coCash" type="number" min="0"></div>
    <div id="coThbNote" style="font-size:11.5px;color:var(--ink-soft);margin:-6px 0 10px;display:none;"></div>
    <div class="rf-row" style="font-size:14px;font-weight:700;"><span>ເງິນທອນ (ກີບ)</span><span id="coChange" class="mono">0 ₭</span></div>
    <div id="coRoundNote" style="font-size:10.5px;color:var(--ink-soft);margin:-6px 0 6px;"></div>
    <div id="coBreakdown" style="margin:6px 0 4px;"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="coCancel">ຍົກເລີກ</button>
      <button class="btn btn-primary" id="coConfirm">ຢືນຢັນການຂາຍ</button>
    </div>
  </div>
</div>

<!-- ຂາຍສຳເລັດ / ເລືອກພິມໃບບິນ -->
<div class="modal-bg" id="doneModalBg">
  <div class="modal">
    <h3>✅ ຂາຍສຳເລັດ</h3>
    <div class="rf-row"><span>ຍອດຂາຍ</span><span id="doneTotal" class="mono"></span></div>
    <div class="rf-row"><span>ເງິນທອນ</span><span id="doneChange" class="mono"></span></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="doneClose">ປິດ (ບໍ່ພິມ)</button>
      <button class="btn btn-primary" id="donePrint">ພິມໃບບິນ</button>
    </div>
  </div>
</div>

<div class="receipt-print" id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script src="pos.js"></script>
</body>
</html>
